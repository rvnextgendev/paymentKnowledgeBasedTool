name: Payment RAG AI PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    # Demo uses trusted same-repository PRs only. No untrusted fork secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: payment_rag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rag -d payment_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rag-service/requirements.txt
      - name: Install Python packages
        run: pip install -r rag-service/requirements.txt
      - name: Index trusted base branch
        working-directory: rag-service
        env:
          DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/payment_rag
        run: python ingest.py
      - name: Review PR and post comment
        working-directory: rag-service
        env:
          DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/payment_rag
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python pr_review.py
